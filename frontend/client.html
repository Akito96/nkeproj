<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мои заявки — РемМастер</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/config.js" defer></script>
  <script src="js/api.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/auth.js" defer></script>
  <script src="js/client.js" defer></script>
</head>
<body>
  <header id="site-header" class="site-header"></header>

  <main class="container">
    <div class="section__header">
      <div>
        <h1 class="section__title">Личный кабинет клиента</h1>
        <p class="section__subtitle">История ваших заявок и отслеживание этапов ремонта</p>
      </div>
      <div class="hero__actions">
        <a class="btn btn--primary btn--sm" href="create-order.html">+ Новая заявка</a>
        <button type="button" id="refresh-orders-btn" class="btn btn--outline btn--sm">Обновить</button>
      </div>
    </div>

    <section aria-label="Фильтр по статусам" class="toolbar" style="margin-block-end: 1.25rem;">
      <div id="client-status-chips" class="chips-bar" role="group" aria-label="Статусы заявок">
        <button type="button" class="chip" data-status="" aria-pressed="true">Все</button>
        <button type="button" class="chip" data-status="accepted" aria-pressed="false">Принята</button>
        <button type="button" class="chip" data-status="diagnostics" aria-pressed="false">В диагностике</button>
        <button type="button" class="chip" data-status="in_repair" aria-pressed="false">В ремонте</button>
        <button type="button" class="chip" data-status="ready" aria-pressed="false">Готова к выдаче</button>
        <button type="button" class="chip" data-status="issued" aria-pressed="false">Выдана</button>
      </div>
    </section>

    <div class="dashboard-layout">
      <section aria-label="Список заявок">
        <div id="client-orders-list" class="orders-column">
          <div class="skeleton-row" aria-hidden="true"></div>
          <div class="skeleton-row" aria-hidden="true"></div>
          <div class="skeleton-row" aria-hidden="true"></div>
        </div>
      </section>

      <section aria-label="Карточка и история статусов заявки">
        <div id="client-order-detail" class="card detail-panel">
          <div class="state-box">
            <p class="state-box__title">Выберите заявку</p>
            <p class="state-box__desc">Нажмите на заявку слева, чтобы увидеть таймлайн статусов, стоимость и комментарии.</p>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2026 РемМастер — Сервисный центр</span>
      <span>Пн–Сб: 09:00 – 20:00</span>
    </div>
  </footer>
</body>
</html>
